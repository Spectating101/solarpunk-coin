# ARCHIVED 2026-08-24: historical SPK v1 operator workflow. Kept for provenance; not executable by GitHub Actions from this path.
name: SPK v1 Operator Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Install spk-v1
        run: npm run spk:v1:py:install
      - name: Weekly foundation rhythm
        env:
          PRIVATE_KEY: ${{ secrets.SPK_V1_OPERATOR_PRIVATE_KEY }}
          SEPOLIA_RPC: ${{ secrets.SEPOLIA_RPC }}
          CYCLE_MINT_KWH: '50'
          CYCLE_REDEEM_SPK: '5'
        run: bash scripts/foundation_weekly.sh
        continue-on-error: true
      - name: Commit foundation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            state/runtime/spk_v1.json \
            state/foundation/ \
            frontend/public/spk_v1.json \
            docs/foundation/FOUNDATION_STATUS.md \
            docs/demo/ \
            || true
          if git diff --staged --quiet; then
            echo "no foundation changes"
            exit 0
          fi
          git commit -m "chore: weekly foundation cycle [skip ci]"
          git push
