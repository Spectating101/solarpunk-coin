<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SolarPunk Protocol · Energy Derivatives</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="dapp-utils.js?v=3"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #070d08;
      --surface:   #0e1a10;
      --border:    #1c2e1f;
      --amber:     #d97706;
      --green:     #34d399;
      --text:      #dde8de;
      --muted:     #567a5c;
      --dim:       #3d5c42;
    }

    html, body, #root {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle noise texture */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4;
    }

    /* Radial glow behind sidebar */
    body::after {
      content: '';
      position: fixed; top: -100px; left: -100px;
      width: 400px; height: 400px; z-index: 0; pointer-events: none;
      background: radial-gradient(circle, rgba(52,211,153,0.04) 0%, transparent 70%);
    }

    #root { position: relative; z-index: 1; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1c2e1f; border-radius: 99px; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tab-content { animation: fadeIn 0.2s ease; }

    input[type=number]::-webkit-inner-spin-button { opacity: 0.3; }
    input:focus { border-color: rgba(52,211,153,0.4) !important; outline: none; }
    button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="dapp-sidebar.jsx"></script>
<script type="text/babel" src="dapp-overview.jsx?v=4"></script>
<script type="text/babel" src="dapp-dashboard.jsx"></script>
<script type="text/babel" src="dapp-pricer.jsx"></script>
<script type="text/babel" src="dapp-hedge.jsx"></script>
<script type="text/babel" src="dapp-positions.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentGreen": "#34d399",
  "accentAmber": "#d97706",
  "bgColor":     "#070d08",
  "fontSerif":   "Instrument Serif",
  "showGreeks":  true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [showTweaks, setShowTweaks] = React.useState(false);
  const [activeTab, setActiveTab]   = React.useState('overview');
  const [account, setAccount]       = React.useState(null);
  const [provider, setProvider]     = React.useState(null);
  const [isConnecting, setIsConnecting] = React.useState(false);
  const [nasaData,   setNasaData]   = React.useState(null);
  const [nasaStatus, setNasaStatus] = React.useState('loading');

  // Fetch real NASA POWER data on mount
  React.useEffect(() => {
    SPKUtils.fetchNASAData(24.99, 121.30, 2022, 2024)
      .then(data => { setNasaData(data); setNasaStatus('ok'); })
      .catch(err  => { console.error('NASA fetch failed:', err); setNasaStatus('error'); });
  }, []);

  // Live oracle feed — ticks every 3s
  const [oracleFeed, setOracleFeed] = React.useState([
    { label: 'Energy Index', value: '$0.0550', ok: true  },
    { label: 'Irradiance',   value: '0.87 kWh/m²', ok: true  },
    { label: 'VaR (99%)',    value: '$0.264', ok: true  },
    { label: 'Oracle src',   value: '3/3 ✓',  ok: true  },
  ]);

  // Update oracle feed from real NASA data when available
  React.useEffect(() => {
    if (!nasaData || nasaData.length === 0) return;
    const ghiSeries = nasaData.map(d => d.ghi);
    const sigma = SPKUtils.computeVolatility(ghiSeries, nasaData);
    const S0 = nasaData[nasaData.length - 1].price;
    const lastGhi = nasaData[nasaData.length - 1].ghi;
    const var99 = SPKUtils.var99Payoff(S0, S0, 0.25, 0.05, sigma, 1000, 60);
    setOracleFeed([
      { label: 'Energy Index', value: `$${S0.toFixed(5)}`,      ok: true },
      { label: 'GHI (latest)', value: `${lastGhi.toFixed(2)} kWh/m²`, ok: true },
      { label: 'VaR (99%)',    value: `$${var99.toFixed(3)}`,   ok: true },
      { label: 'Oracle src',   value: 'NASA ✓',                 ok: true },
    ]);
  }, [nasaData]);

  // Wallet
  React.useEffect(() => {
    if (window.ethereum && window.ethers) setProvider(new window.ethers.BrowserProvider(window.ethereum));
  }, []);

  const connectWallet = async () => {
    if (!provider) return;
    setIsConnecting(true);
    try {
      const accounts = await provider.send('eth_requestAccounts', []);
      setAccount(accounts[0]);
    } catch(e) { console.error(e); }
    finally { setIsConnecting(false); }
  };

  // Tweaks panel
  React.useEffect(() => {
    const handler = e => {
      if (e.data?.type === '__activate_edit_mode')   setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  // Apply tweaks to CSS vars
  React.useEffect(() => {
    document.documentElement.style.setProperty('--green', tweaks.accentGreen);
    document.documentElement.style.setProperty('--amber', tweaks.accentAmber);
    document.documentElement.style.setProperty('--bg',    tweaks.bgColor);
    document.body.style.background = tweaks.bgColor;
  }, [tweaks]);

  const tabs = { overview: Overview, dashboard: Dashboard, pricer: Pricer, hedge: Hedge, positions: Positions };
  const TabContent = tabs[activeTab];

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
      <Sidebar
        activeTab={activeTab}
        setActiveTab={setActiveTab}
        account={account}
        connectWallet={connectWallet}
        isConnecting={isConnecting}
        oracleFeed={oracleFeed}
      />

      <main style={{
        flex: 1, overflowY: 'auto', padding: '32px 36px',
        background: 'transparent',
      }}>
        <div className="tab-content" key={activeTab}>
          <TabContent nasaData={nasaData} nasaStatus={nasaStatus} account={account} />
        </div>
      </main>

      {showTweaks && (
        <TweaksPanel onClose={() => {
          setShowTweaks(false);
          window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
        }}>
          <TweakSection title="Colors">
            <TweakColor label="Accent Green" value={tweaks.accentGreen} onChange={v => setTweak('accentGreen', v)}/>
            <TweakColor label="Accent Amber" value={tweaks.accentAmber} onChange={v => setTweak('accentAmber', v)}/>
            <TweakColor label="Background"   value={tweaks.bgColor}     onChange={v => setTweak('bgColor', v)}/>
          </TweakSection>
          <TweakSection title="Display">
            <TweakToggle label="Show Greeks panel" value={tweaks.showGreeks} onChange={v => setTweak('showGreeks', v)}/>
          </TweakSection>
        </TweaksPanel>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
