name: Case Workbench V2 CI

on:
  pull_request:
    paths:
      - 'packages/constraint-core/**'
      - 'protocol/policies-v2/**'
      - 'protocol/cases/**'
      - 'protocol/schema/**'
      - 'frontend/**'
      - 'scripts/capture_case_workbench_v2.mjs'
      - 'scripts/check_frontend_bundle.mjs'
      - 'scripts/check_receipt_context.mjs'
      - 'scripts/check_visual_quality.mjs'
      - 'scripts/check_accessibility.mjs'
      - 'scripts/check_sdk_package.mjs'
      - 'package*.json'
      - '.github/workflows/case_workbench_v2.yml'
  push:
    branches: [main]
    paths:
      - 'packages/constraint-core/**'
      - 'protocol/**'
      - 'frontend/**'
      - 'scripts/capture_case_workbench_v2.mjs'
      - 'scripts/check_receipt_context.mjs'
      - 'scripts/check_visual_quality.mjs'
      - 'scripts/check_accessibility.mjs'
      - 'scripts/check_sdk_package.mjs'
      - 'scripts/check_frontend_bundle.mjs'
      - 'package*.json'
      - '.github/workflows/case_workbench_v2.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workbench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Test deterministic workbench core
        run: |
          mkdir -p _ci_logs
          set -o pipefail
          node --test packages/constraint-core/test/*.test.mjs 2>&1 | tee _ci_logs/core-test.log

      - name: Check SDK package contents
        run: node scripts/check_sdk_package.mjs

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Test frontend workbench
        run: |
          set -o pipefail
          npm run test:run 2>&1 | tee ../_ci_logs/frontend-test.log
        working-directory: frontend

      - name: Build frontend workbench
        env:
          VITE_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../_ci_logs/frontend-build.log
        working-directory: frontend

      - name: Verify default bundle boundaries
        run: node scripts/check_frontend_bundle.mjs frontend/dist | tee _ci_logs/frontend-bundle-check.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture browser flows and check visual quality and accessibility
        run: |
          set -o pipefail
          cd frontend
          npm run preview -- --host 127.0.0.1 --port 4173 > ../_ci_logs/browser-preview.log 2>&1 &
          cd ..
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ >/dev/null
          node scripts/capture_case_workbench_v2.mjs _review_case_workbench_v2 2>&1 | tee _ci_logs/browser-capture.log
          node scripts/check_receipt_context.mjs _review_receipt_context 2>&1 | tee _ci_logs/receipt-context.log
          node scripts/check_visual_quality.mjs _ci_logs/visual-quality.json 2>&1 | tee _ci_logs/visual-quality.log
          node scripts/check_accessibility.mjs _ci_logs/accessibility.json 2>&1 | tee _ci_logs/accessibility.log

      - name: Upload V2 CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-workbench-v2-ci-diagnostics
          path: _ci_logs/
          retention-days: 5

      - name: Upload V2 visual review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: case-workbench-v2-visual
          path: _review_case_workbench_v2/
          retention-days: 14

      - name: Upload V2 deployable site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: case-workbench-v2-site
          path: frontend/dist/
          retention-days: 14
