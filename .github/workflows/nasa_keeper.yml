name: NASA Solar Keeper

# Runs daily at 01:00 UTC (09:00 Taiwan time).
# Fetches real solar irradiance for Taoyuan from NASA POWER and pushes
# it to the live SolarPunk contracts on Sepolia as oracle index updates.
# The resulting log is committed back to the repo as a permanent research record.

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC daily
  workflow_dispatch:        # allow manual trigger for testing

jobs:
  keeper:
    name: Push NASA data to Sepolia
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit the keeper log back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run NASA keeper
        env:
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          SEPOLIA_RPC: ${{ secrets.SEPOLIA_RPC }}
        run: npx hardhat run scripts/nasa_keeper.js --network sepolia

      - name: Commit keeper log
        run: |
          git config user.name  "NASA Keeper Bot"
          git config user.email "keeper@solarpunk-protocol.local"
          git add state/keeper_logs/
          if git diff --cached --quiet; then
            echo "No new log to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            COMMIT_MSG="keeper: NASA solar data push ${DATE} [skip ci]"
            git commit -m "$COMMIT_MSG"
            git push
          fi
