name: Constraint Protocol Alpha CI

on:
  pull_request:
    paths:
      - 'packages/constraint-core/**'
      - 'protocol/policies/**'
      - 'protocol/schema/**'
      - 'contracts/protocol/**'
      - 'test/ConstraintProtocol.test.js'
      - 'scripts/protocol_alpha_demo.mjs'
      - 'scripts/deploy_constraint_protocol_alpha.js'
      - 'scripts/capture_constraint_protocol_alpha.mjs'
      - 'frontend/**'
      - 'docs/protocol/**'
      - '.github/workflows/constraint_protocol_alpha.yml'
      - '.github/workflows/deploy_constraint_protocol_alpha_sepolia.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Test constraint core and policy conformance
        run: node --test packages/constraint-core/test/*.test.mjs

      - name: Check SDK package contents
        run: npm pack --dry-run
        working-directory: packages/constraint-core

      - name: Run deterministic alpha demo
        run: node scripts/protocol_alpha_demo.mjs

      - name: Test protocol contracts
        run: npx hardhat test test/ConstraintProtocol.test.js

      - name: Deploy local protocol smoke stack
        run: npx hardhat run scripts/deploy_constraint_protocol_alpha.js

      - name: Test complete contract suite
        run: npx hardhat test

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Test frontend
        run: |
          mkdir -p ../_ci_logs
          set -o pipefail
          npm run test:run 2>&1 | tee ../_ci_logs/frontend-test.log
        working-directory: frontend

      - name: Build frontend
        run: |
          mkdir -p ../_ci_logs
          set -o pipefail
          npm run build 2>&1 | tee ../_ci_logs/frontend-build.log
        working-directory: frontend

      - name: Upload frontend CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constraint-protocol-alpha-ci-diagnostics
          path: _ci_logs/
          retention-days: 3

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture protocol alpha browser flows
        run: |
          cd frontend
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/protocol-alpha-preview.log 2>&1 &
          cd ..
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ >/dev/null
          node scripts/capture_constraint_protocol_alpha.mjs _review_protocol_alpha

      - name: Upload protocol alpha runtime proof
        uses: actions/upload-artifact@v4
        with:
          name: constraint-protocol-alpha-runtime
          path: |
            state/protocol/constraint_protocol_alpha_demo.json
            state/protocol/constraint_protocol_alpha_runtime.json
          retention-days: 14

      - name: Upload deployable frontend build
        uses: actions/upload-artifact@v4
        with:
          name: constraint-protocol-alpha-site
          path: frontend/dist/
          retention-days: 14

      - name: Upload protocol alpha visual review
        uses: actions/upload-artifact@v4
        with:
          name: constraint-protocol-alpha-visual
          path: _review_protocol_alpha/
          retention-days: 14
