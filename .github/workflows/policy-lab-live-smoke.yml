name: Policy Lab Live Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
  workflow_run:
    workflows: ["Deploy Policy Lab to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  live-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated browser tooling
        run: npm install --prefix "$RUNNER_TEMP/policy-live-smoke" --no-save playwright@1.61.1

      - name: Install Chromium
        run: >-
          "$RUNNER_TEMP/policy-live-smoke/node_modules/.bin/playwright"
          install --with-deps chromium

      - name: Test live Policy Lab
        env:
          POLICY_LAB_URL: https://spectating101.github.io/solarpunk-coin/demo/
          PLAYWRIGHT_IMPORT: 'file://${{ runner.temp }}/policy-live-smoke/node_modules/playwright/index.mjs'
        run: node scripts/smoke_live_policy_lab.mjs
