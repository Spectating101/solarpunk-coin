# Build and publish the Constraint / SolarPunk lab to the repository's legacy
# GitHub Pages source: /docs on main.
#
# Live path: https://spectating101.github.io/solarpunk-coin/demo/
#
# The workflow mirrors the current Vite build into docs/demo and commits only
# generated demo changes back to main. GitHub's GITHUB_TOKEN push does not
# recursively trigger another workflow run.

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Preflight Public Lab
        run: |
          npm install
          npm run public-lab:preflight

      - name: Test deterministic case workbench core
        run: node --test packages/constraint-core/test/*.test.mjs

      - name: Install and test public interface
        working-directory: frontend
        run: |
          npm install
          npm run test:run

      - name: Build and mirror demo to docs/demo
        env:
          VITE_SOURCE_REVISION: ${{ github.sha }}
        run: bash scripts/publish_demo_to_docs.sh

      - name: Confirm flagship research surfaces
        run: |
          test -f docs/demo/index.html
          test -f docs/demo/spk_v1.json
          test -f docs/demo/empirical/market-capacity-v1/market-capacity-summary.json
          test -f docs/demo/empirical/market-capacity-v1/methods-manifest.json
          node -e 'const j=require("./docs/demo/spk_v1.json"); if(!j.contracts?.solar_punk_coin) process.exit(1); console.log(j.product, j.contracts.solar_punk_coin);'
          node -e 'const j=require("./docs/demo/empirical/market-capacity-v1/market-capacity-summary.json"); if(!j.policy_metrics?.length) process.exit(1); console.log(j.study_id, j.policy_metrics.length);'
          grep -q 'Policy Lab | Case Workbench' docs/demo/index.html

      - name: Commit deployable Pages mirror
        run: |
          if git diff --quiet -- docs/demo; then
            echo "docs/demo already matches the current build"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo
          git commit -m "Publish Constraint empirical lab [skip ci]"
          git push origin HEAD:main
