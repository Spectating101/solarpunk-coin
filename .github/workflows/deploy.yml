# Verify Public Lab demo build
#
# GitHub Pages for this repo is served from /docs on main (legacy).
# Live demo path: https://spectating101.github.io/solarpunk-coin/demo/
# Publishing: commit updates under docs/demo/ (npm run public-lab:publish locally).

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Root package-lock.json is gitignored; cache frontend lock instead.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Preflight Public Lab
        run: |
          npm install
          npm run public-lab:preflight

      - name: Build and mirror demo to docs/demo
        run: bash scripts/publish_demo_to_docs.sh

      - name: Confirm demo artifact
        run: |
          test -f docs/demo/index.html
          test -f docs/demo/spk_v1.json
          node -e 'const j=require("./docs/demo/spk_v1.json"); if(!j.contracts?.solar_punk_coin) process.exit(1); console.log(j.product, j.contracts.solar_punk_coin);'
