name: Policy Lab Submission Assets

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docs/submission/**'
      - 'benchmark/gauntlet/submission-package.v1.json'
      - 'scripts/capture_policy_lab_submission_assets.mjs'
      - '.github/workflows/policy-lab-submission-assets.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build Policy Lab
        env:
          VITE_SOURCE_REVISION: ${{ github.sha }}
        run: npm run build
        working-directory: frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture judge-facing assets
        run: |
          set -euo pipefail
          cd frontend
          npm run preview -- --host 127.0.0.1 --port 4173 > ../_submission_preview.log 2>&1 &
          cd ..
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ >/dev/null
          node scripts/capture_policy_lab_submission_assets.mjs _submission_assets

      - name: Upload submission visual package
        uses: actions/upload-artifact@v4
        with:
          name: policy-lab-submission-assets-${{ github.sha }}
          path: |
            _submission_assets/
            _submission_preview.log
          retention-days: 90
