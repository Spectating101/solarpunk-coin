name: Conformance Benchmark v1

on:
  pull_request:
    paths:
      - 'benchmark/**'
      - 'scripts/run_conformance_benchmark_v1.mjs'
      - 'packages/constraint-core/**'
      - '.github/workflows/conformance-benchmark-v1.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  c0-c2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Validate benchmark manifest and runner contract
        run: npm --prefix packages/constraint-core run conformance:v1:test

      - name: Record frozen execution plan
        run: npm --prefix packages/constraint-core run conformance:v1:list > benchmark/reports/conformance-v1-plan.json

      - name: Run C0-C2 benchmark
        run: npm --prefix packages/constraint-core run conformance:v1 -- --out=benchmark/reports/conformance-v1-ubuntu-node22.json

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-benchmark-v1-c0-c2
          path: |
            benchmark/reports/conformance-v1-plan.json
            benchmark/reports/conformance-v1-ubuntu-node22.json
          retention-days: 30
