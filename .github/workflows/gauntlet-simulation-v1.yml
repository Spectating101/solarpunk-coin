name: Gauntlet Simulation v1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - benchmark/gauntlet/**
      - scripts/run_gauntlet_simulation_v1.mjs
      - .github/workflows/gauntlet-simulation-v1.yml

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run scaled synthetic entry-pool simulation
        run: |
          set -euo pipefail
          node scripts/run_gauntlet_simulation_v1.mjs \
            --trials=3000 \
            --out="$RUNNER_TEMP/gauntlet-a"

      - name: Re-run and prove deterministic output
        run: |
          set -euo pipefail
          node scripts/run_gauntlet_simulation_v1.mjs \
            --trials=3000 \
            --out="$RUNNER_TEMP/gauntlet-b" >/dev/null
          cmp "$RUNNER_TEMP/gauntlet-a/gauntlet-simulation-v1.json" "$RUNNER_TEMP/gauntlet-b/gauntlet-simulation-v1.json"
          cmp "$RUNNER_TEMP/gauntlet-a/gauntlet-simulation-v1.md" "$RUNNER_TEMP/gauntlet-b/gauntlet-simulation-v1.md"

      - name: Show evaluator summary
        run: cat "$RUNNER_TEMP/gauntlet-a/gauntlet-simulation-v1.md"

      - name: Upload simulation report
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-simulation-v1-${{ github.sha }}
          path: ${{ runner.temp }}/gauntlet-a/
          retention-days: 90
