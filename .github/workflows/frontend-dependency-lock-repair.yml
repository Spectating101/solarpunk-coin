name: Frontend Dependency Lock Repair

on:
  push:
    branches:
      - feat/policy-lab-release-integration
    paths:
      - .github/workflows/frontend-dependency-lock-repair.yml
      - frontend/package.json

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: feat/policy-lab-release-integration

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate package lock from declared security floor
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Record resolved security versions
        working-directory: frontend
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          for (const name of ['ethers', 'ws', 'lodash']) {
            const item = lock.packages[`node_modules/${name}`];
            console.log(`${name}=${item?.version || 'missing'}`);
          }
          NODE

      - name: Commit regenerated lock only
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo 'package-lock.json already matches the declared dependency floor'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git commit -m 'Regenerate frontend lock after security floor update'
          git push origin HEAD:feat/policy-lab-release-integration
