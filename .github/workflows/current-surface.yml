name: Current Surface Integrity

on:
  pull_request:
    paths:
      - 'README.md'
      - 'package.json'
      - 'CURRENT_SURFACE.json'
      - 'frontend/src/App.jsx'
      - 'frontend/src/app/routes.js'
      - 'frontend/src/app/CaseWorkbenchProvider.jsx'
      - 'frontend/src/lib/energyCasePack.js'
      - 'frontend/src/data/publicEvidenceCheckpoint.js'
      - 'frontend/src/data/publicEvidenceCheckpoint.test.js'
      - 'frontend/src/components/PublicEvidenceCheckpoint.jsx'
      - 'frontend/src/components/LabOverview.jsx'
      - 'protocol/cases/energy-v1/**'
      - 'protocol/policies-v2/**'
      - 'protocol/schema/claim-assessment-package.v0.1.schema.json'
      - 'scripts/lib/claim_assessment_package_v0_1.mjs'
      - 'scripts/build_claim_assessment_package.mjs'
      - 'scripts/verify_claim_assessment_package.mjs'
      - 'scripts/external_case_001p_ausgrid.mjs'
      - 'scripts/policy_lab_preflight.mjs'
      - 'scripts/publish_demo_to_docs.sh'
      - 'scripts/smoke_live_policy_lab.mjs'
      - 'scripts/check_current_surface.mjs'
      - '.github/workflows/external-case-001p-ausgrid.yml'
      - '.github/workflows/policy-lab-live-smoke.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/current-surface.yml'
      - 'archive/github-workflows/**'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'package.json'
      - 'CURRENT_SURFACE.json'
      - 'frontend/src/App.jsx'
      - 'frontend/src/app/routes.js'
      - 'frontend/src/app/CaseWorkbenchProvider.jsx'
      - 'frontend/src/lib/energyCasePack.js'
      - 'frontend/src/data/publicEvidenceCheckpoint.js'
      - 'frontend/src/data/publicEvidenceCheckpoint.test.js'
      - 'frontend/src/components/PublicEvidenceCheckpoint.jsx'
      - 'frontend/src/components/LabOverview.jsx'
      - 'protocol/cases/energy-v1/**'
      - 'protocol/policies-v2/**'
      - 'protocol/schema/claim-assessment-package.v0.1.schema.json'
      - 'scripts/lib/claim_assessment_package_v0_1.mjs'
      - 'scripts/build_claim_assessment_package.mjs'
      - 'scripts/verify_claim_assessment_package.mjs'
      - 'scripts/external_case_001p_ausgrid.mjs'
      - 'scripts/policy_lab_preflight.mjs'
      - 'scripts/publish_demo_to_docs.sh'
      - 'scripts/smoke_live_policy_lab.mjs'
      - 'scripts/check_current_surface.mjs'
      - '.github/workflows/external-case-001p-ausgrid.yml'
      - '.github/workflows/policy-lab-live-smoke.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/current-surface.yml'
      - 'archive/github-workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate current executable surface
        run: node scripts/check_current_surface.mjs
      - name: Validate deployment preflight
        run: node scripts/policy_lab_preflight.mjs
