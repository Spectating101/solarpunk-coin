name: hardhat-deploy (legacy)

# DEPRECATED — deploys pre-SP-v1 stack via scripts/deploy.js.
# Canonical Public Lab v1.0 is already on Sepolia (see state/runtime/spk_v1.json).
# Requires workflow input confirm_legacy=true to run.

on:
  workflow_dispatch:
    inputs:
      confirm_legacy:
        description: Type true to deploy the legacy stack (not SPK v1)
        required: true
        default: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Block accidental legacy deploy
        run: |
          if [ "${{ github.event.inputs.confirm_legacy }}" != "true" ]; then
            echo "Refusing legacy deploy. Set confirm_legacy=true if you really intend scripts/deploy.js."
            exit 1
          fi

      - name: Check deployment secrets
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          test -n "$RPC_URL" || (echo "Missing RPC_URL secret" && exit 1)
          test -n "$PRIVATE_KEY" || (echo "Missing PRIVATE_KEY secret" && exit 1)

      - name: Deploy to sepolia
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          npx hardhat compile
          npx hardhat run scripts/deploy.js --network sepolia
