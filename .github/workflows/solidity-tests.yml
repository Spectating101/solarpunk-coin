name: solidity-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  solidity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Test
        run: npx hardhat test

  node-product-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Attestation script tests
        run: npm run attestations:test

      - name: Product script tests
        run: node --test test-node/*.test.js
