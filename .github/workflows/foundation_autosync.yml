name: Foundation autosync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install spk-v1
        run: npm run spk:v1:py:install

      - name: Sync runtime from Sepolia
        env:
          SEPOLIA_RPC: ${{ secrets.SEPOLIA_RPC }}
        run: npm run foundation:sync
        continue-on-error: true

      - name: Operator health
        env:
          SEPOLIA_RPC: ${{ secrets.SEPOLIA_RPC }}
        run: npm run foundation:health || true

      - name: Peg simulation summary
        run: npm run foundation:peg-check
        continue-on-error: true

      - name: Publish demo to docs/demo
        run: npm run foundation:publish-docs

      - name: Commit foundation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            state/runtime/spk_v1.json \
            state/foundation/ \
            frontend/public/spk_v1.json \
            docs/foundation/FOUNDATION_STATUS.md \
            docs/demo/spk_v1.json \
            || true
          if git diff --staged --quiet; then
            echo "no foundation changes"
            exit 0
          fi
          git commit -m "chore: foundation autosync [skip ci]"
          git push
