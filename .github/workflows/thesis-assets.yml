name: Thesis asset reproduction
on:
  pull_request:
    paths: ['thesis_package/**', 'state/runtime/spk_v1.json', 'package.json', '.github/workflows/thesis-assets.yml']
  push:
    branches: [main]
    paths: ['thesis_package/**', 'state/runtime/spk_v1.json', 'package.json', '.github/workflows/thesis-assets.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install numpy pandas matplotlib
      - run: npm run thesis:verify
