[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spk-v1"
version = "0.1.0"
description = "SPK v1 Sepolia runtime sync, chain indexing, and evidence export"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "SolarPunk" }]
keywords = ["spk", "sepolia", "energy", "blockchain", "runtime"]
dependencies = [
  "web3>=6.0.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "httpx>=0.27.0",
]

[project.scripts]
spk-v1 = "spk_v1.cli:main"
spk-v1-api = "spk_v1.api:main"

[project.urls]
Repository = "https://github.com/Spectating101/solarpunk-coin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spk_v1 = ["abis/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: live Sepolia RPC tests",
]
